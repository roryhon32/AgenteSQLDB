database:
  # Caminho do banco DuckDB oficial corporativo
  db_path: "data/banco.duckdb"

  # Número máximo de linhas enviadas ao LLM para síntese da resposta
  max_rows_context: 15

  # Timeout máximo (em segundos) para execução de uma query
  query_timeout: 30

llm:
  # Backend do LLM: "groq" (com fallback para GitHub Models), "ollama" (local) ou "openai"
  backend: "groq"

  # Modelo Groq principal (com failover para GitHub Models)
  groq_model: "llama-3.3-70b-versatile"
  github_model: "gpt-4o-mini"

  # Modelo Ollama local (caso backend = "ollama")
  ollama_model: "qwen2.5-coder:7b"
  ollama_base_url: "http://localhost:11434"

  # Modelo OpenAI (utilizado quando backend = "openai")
  openai_model: "gpt-4o-mini"

  # Temperatura do LLM (0.0 = determinístico)
  temperature: 0.0

  # Máximo de tentativas de auto-recuperação em caso de erro SQL
  max_retries: 2

security:
  # Defesa em Profundidade: conexão read-only nativa
  read_only_connection: true

  # Controle de Complexidade AST
  max_joins: 3
  max_subqueries: 2
  max_explain_cost: 5000
  max_result_bytes: 5242880  # 5 MB
  auto_limit: 100

  # Rate Limiting & Circuit Breaker
  rate_limit_per_minute: 30
  circuit_breaker_failures: 3
  circuit_breaker_window_seconds: 300
  circuit_breaker_cooldown_seconds: 900

  # Observabilidade e Alertas
  rejection_rate_baseline: 0.20
  timeout_warning_threshold_ms: 24000

